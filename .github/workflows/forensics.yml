name: DFlow on-chain forensics

on:
  workflow_dispatch:
    inputs:
      max_signature_pages:
        description: "1000 signatures/page; increase when using an archival RPC"
        required: false
        default: "2"
      scan_tx_limit:
        description: "Oldest transactions per account to decode for mint/burn evidence"
        required: false
        default: "50"
  schedule:
    - cron: "17 7 * * 1"
  push:
    paths:
      - "analyze.py"
      - "targets.json"
      - ".github/workflows/forensics.yml"

permissions:
  contents: read

jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      MAX_SIGNATURE_PAGES: ${{ inputs.max_signature_pages || '2' }}
      SCAN_TX_LIMIT: ${{ inputs.scan_tx_limit || '50' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m py_compile analyze.py

      - name: Probe DFlow open-order ABI
        run: python probe_api.py
        continue-on-error: true

      - name: Upload ABI probe result
        uses: actions/upload-artifact@v4
        with:
          name: dflow-abi-probe-${{ github.run_id }}
          path: reports/api-probe.json
          if-no-files-found: warn

      - name: Check RPC prerequisite
        run: |
          if [ -z "$SOLANA_RPC_URL" ]; then
            echo "::warning::SOLANA_RPC_URL is not configured. Skipping history-heavy collection to avoid public RPC rate limits."
            echo "Full collector requires a historical Solana RPC endpoint configured as the SOLANA_RPC_URL repository secret."
          fi

      - name: Run Solana forensic collector
        if: env.SOLANA_RPC_URL != ''
        run: timeout 900s python analyze.py --targets targets.json --out-dir reports

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dflow-solana-forensics-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
